name: Deploy backend

# Builds the backend image, pushes it to GHCR, then SSHes into the server and pulls
# + restarts. The frontend deploys separately via Cloudflare Pages' own GitHub
# integration — nothing in this workflow touches it. Requires three repo secrets —
# see docs/deployment.md:
#   DEPLOY_HOST      the VM's public IP (or hostname)
#   DEPLOY_USER      the SSH user on the VM (e.g. "ubuntu")
#   DEPLOY_SSH_KEY   the private half of a dedicated deploy keypair

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-scraper-backend:latest
            ghcr.io/${{ github.repository_owner }}/job-scraper-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/job-scraper
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker image prune -f
