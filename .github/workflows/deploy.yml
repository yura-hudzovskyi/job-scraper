name: Deploy backend

# Builds the backend image, pushes it to GHCR, then SSHes into the server and pulls
# + restarts. The frontend deploys separately via Cloudflare Pages' own GitHub
# integration — nothing in this workflow touches it. Requires three repo secrets —
# see docs/deployment.md:
#   DEPLOY_HOST      the VM's public IP (or hostname)
#   DEPLOY_USER      the SSH user on the VM (e.g. "ubuntu")
#   DEPLOY_SSH_KEY   the private half of a dedicated deploy keypair

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docker-compose.prod.yml"
      - "Caddyfile"
      - ".github/workflows/deploy.yml"

jobs:
  build-and-push:
    # Native ARM64 runner (free for public repos) — the Oracle VM is Ampere (ARM64),
    # so building natively avoids cross-compiling under QEMU emulation. No
    # docker/setup-qemu-action needed as a result.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry-based cache (a dedicated :buildcache tag on the same GHCR package)
      # rather than type=gha, whose 10GB-per-repo quota evicts layers between runs.
      # GHCR storage for a public repo's packages isn't bounded the same way, so
      # this cache actually persists.
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/job-scraper-backend:latest
            ghcr.io/${{ github.repository_owner }}/job-scraper-backend:${{ github.sha }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/job-scraper-backend:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/job-scraper-backend:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The server needs exactly two files from this repo — the compose file and
      # the Caddyfile — and it used to fetch them by running `git pull` itself.
      # That made every deploy depend on the box holding working GitHub
      # credentials, which is one more thing that can expire (and did: a private
      # repo over HTTPS asks for a username no non-interactive shell can answer).
      # Copying them from the runner removes the dependency: the server needs no
      # repo access at all now, only the image from GHCR.
      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.prod.yml,Caddyfile
          target: ~/job-scraper
          overwrite: true

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/job-scraper
            docker compose -f docker-compose.prod.yml pull
            # --remove-orphans drops containers whose service no longer exists in
            # the compose file — the retired `ollama` one, for instance.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml run --rm api alembic upgrade head
            docker image prune -f
