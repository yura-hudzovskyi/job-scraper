services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: job_scraper
      POSTGRES_PASSWORD: job_scraper
      POSTGRES_DB: job_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port — only reachable from other containers on this box.

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Local LLM — no per-token API cost. Needs a model pulled in once
  # (docs/deployment.md) and enough RAM for whichever model you choose. `api` calls
  # it for CV analysis when GEMINI_API_KEY isn't set or Gemini's free tier is
  # rate-limited; `worker` calls it unconditionally for job skill extraction
  # (see docs/matching-engine.md's "LLM provider policy"). `beat` never calls it —
  # it only schedules, it doesn't run task bodies itself.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Celery's worker pool runs several tasks concurrently (one per CPU core by
      # default) — without this, Ollama will happily try to run more than one of
      # those requests' inferences *in parallel* rather than queueing them. Two
      # concurrent qwen2.5:14b inferences need ~26GB RAM combined on a 23GB box —
      # they don't just run a bit slower, they thrash for RAM and can both blow
      # past OLLAMA_TIMEOUT_SECONDS. Forcing this to 1 makes concurrent requests
      # queue cleanly instead, each still finishing in its normal ~60-90s once its
      # turn comes up. See docs/deployment.md.
      OLLAMA_NUM_PARALLEL: 1
      # Verbose server-side logging (prompt that reached the model, context/token
      # counts, per-stage timings) — see docs/deployment.md. `docker compose logs -f
      # ollama` to read it.
      OLLAMA_DEBUG: "1"
    volumes:
      - ollama_data:/root/.ollama

  api:
    image: ghcr.io/yura-hudzovskyi/job-scraper-backend:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    depends_on:
      - postgres
      - redis
      - ollama

  worker:
    image: ghcr.io/yura-hudzovskyi/job-scraper-backend:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    volumes:
      # sentence-transformers' embedding model cache — without this it re-downloads
      # from HuggingFace on every deploy (every container recreate), not just once.
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - postgres
      - redis
      - ollama

  beat:
    image: ghcr.io/yura-hudzovskyi/job-scraper-backend:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  # Terminates HTTPS for the API and reverse-proxies to it. The frontend is not
  # served from this box at all — it's on Cloudflare Pages. See docs/deployment.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  ollama_data:
  hf_cache:
