services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: job_scraper
      POSTGRES_PASSWORD: job_scraper
      POSTGRES_DB: job_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port — only reachable from other containers on this box.

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    image: ghcr.io/yura-hudzovskyi/job-scraper-backend:latest
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file: .env
    depends_on:
      - postgres
      - redis

  worker:
    image: ghcr.io/yura-hudzovskyi/job-scraper-backend:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  # The self-hosted understanding models (spec 3.5.3): GLiNER2 extraction, and
  # the concept-linking models that join it. Separate from `worker` because the
  # weights are ~4 GB resident and the worker runs four prefork children, each
  # of which would hold a copy — and because `api` shares the worker's image, so
  # torch there would ship with every API deploy.
  #
  # No published port. Reachable only on this compose network, the same way
  # postgres and redis are, which is what stands in for authentication.
  ml-service:
    image: ghcr.io/yura-hudzovskyi/job-scraper-ml-service:latest
    restart: unless-stopped
    env_file: .env
    # Room for the model plus a batch, and a ceiling so a runaway forward pass
    # cannot take Postgres down with it. Measured: 3.9 GB resident after load.
    mem_limit: 7g
    # Two of four cores. Extraction is background work; scraping and matching
    # are not, and they share this box.
    cpus: 2.0

  beat:
    image: ghcr.io/yura-hudzovskyi/job-scraper-backend:latest
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - postgres
      - redis

  # Terminates HTTPS for the API and reverse-proxies to it. The frontend is not
  # served from this box at all — it's on Cloudflare Pages. See docs/deployment.md.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
