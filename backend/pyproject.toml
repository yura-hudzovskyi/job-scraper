[project]
name = "job-scraper-backend"
version = "0.1.0"
description = "Job Intelligence Platform — API + workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # psycopg: Alembic's sync engine. asyncpg: the app's async runtime engine —
    # psycopg's async mode can't run under uvicorn's Windows event loop policy
    # (ProactorEventLoop), asyncpg has no such restriction. See db/session.py.
    "psycopg[binary]>=3.2",
    "asyncpg>=0.29",
    # Vector storage and cosine search. Not optional any more: embedding search
    # is the pipeline, not an add-on to it.
    "pgvector>=0.3",
    "redis>=5.0",
    "celery>=5.4",
    # The only client any model provider needs — Voyage is two REST endpoints
    # (app/integrations/voyage.py), and the source adapters speak HTTP too.
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "python-multipart>=0.0.9",
    "pypdf>=4.3",
    "python-docx>=1.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.12",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
# Matches the Dockerfile's base image. Below 3.12, mypy can't even parse some
# installed dependency stubs, so this is what makes it runnable at all.
python_version = "3.13"
strict = true

[[tool.mypy.overrides]]
# celery ships no py.typed marker; its own decorators are untyped as a result.
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# @celery_app.task(...) is an untyped decorator factory for the same reason.
module = "app.workers.tasks.*"
disable_error_code = ["untyped-decorator"]

[tool.setuptools.packages.find]
# alembic/, tests/ etc. live alongside app/ but aren't part of the installed package.
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
